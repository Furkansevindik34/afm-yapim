<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFM Yapım Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
}

input, button, textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:5px;
}

button{
    background:#c89b3c;
    color:white;
    border:0;
    cursor:pointer;
}

.card{
    background:#222;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>AFM Yapım Admin Panel</h1>

<div id="loginBox" class="card">

<h3>Giriş</h3>

<input id="email" placeholder="E-posta">

<input id="password" type="password" placeholder="Şifre">

<button onclick="login()">Giriş Yap</button>

</div>


<div id="panel" class="card hidden">
    <hr>

<h2>Galeri Yönetimi</h2>

<input type="file" id="galleryFile">

<input id="galleryTitle" placeholder="Foto başlığı">

<button onclick="uploadGallery()">Foto Yükle</button>
    <h2>Site Yazıları</h2>

<input placeholder="Ana başlık">

<textarea placeholder="Hakkımızda"></textarea>

<input placeholder="İletişim">

<button>Kaydet</button>
    <hr>

<h2>Site Yazıları</h2>

<label>Ana Başlık</label>
<input id="home_title">

<label>Hakkımızda</label>
<textarea id="about_text"></textarea>

<label>İletişim</label>
<input id="contact">

<button onclick="saveSettings()">Yazıları Kaydet</button>

<h2>Hoş geldin</h2>

<button onclick="logout()">Çıkış</button>

<hr>

<h3>Galeri Fotoğraf Ekle</h3>

<input id="imageUrl" placeholder="Fotoğraf adresi">

<button onclick="addGallery()">Fotoğraf Ekle</button>

<div id="galleryList"></div>

</div>

</div>
<script src="supabase.js"></script>

<script>

async function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;


const {data,error}=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});


if(error){
alert(error.message);
return;
}


document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");

loadGallery();

}



async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}



async function addGallery(){

const url=document.getElementById("imageUrl").value;


const {error}=await supabaseClient
.from("gallery")
.insert([
{
image_url:url,
title:"Yeni Fotoğraf"
}
]);


if(error){

alert("Hata oluştu");
return;

}


alert("Fotoğraf eklendi");

loadGallery();

}



async function loadGallery(){

const {data,error}=await supabaseClient
.from("gallery")
.select("*")
.order("id",{ascending:false});


if(error)return;


let html="";


data.forEach(item=>{

html+=`

<div class="card">

<img src="${item.image_url}" width="200">

<p>${item.title}</p>

</div>

`;

});


document.getElementById("galleryList").innerHTML=html;

}


</script>


</body>
</html>
